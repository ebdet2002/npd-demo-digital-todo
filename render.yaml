services:
  - type: web
    name: deep-shallow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./db/app.db
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: deep-shallow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # The backend's PUBLIC URL. Vite bakes this into the bundle at build
      # time, and the browser calls it directly. Don't use
      # `fromService: { property: host }` here: that yields Render's
      # private-network hostname ("deep-shallow-backend"), which browsers
      # can't resolve. If your backend service gets a different public URL
      # (e.g. a suffix because the name was taken), update this value.
      - key: VITE_API_BASE_URL
        value: https://deep-shallow-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
