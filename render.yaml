services:
  - type: web
    name: deep-shallow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./db/app.db
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: deep-shallow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Render exposes the backend's public hostname here (no scheme). The
      # frontend's api.js prefixes "https://" automatically when this value
      # doesn't already start with http(s)://, so local dev (which sets a
      # full http://localhost:... URL via .env) keeps working unchanged.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: deep-shallow-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
